name = "intvl-2"
compatibility_date = "2024-11-18"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Cloudflare D1 Serverless SQLite Binding
[[d1_databases]]
binding = "DB"
database_name = "intvl_2_d1"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with output from `wrangler d1 create intvl_2_d1`
migrations_dir = "drizzle"

# [vars] can be defined here for Cloudflare Pages environment variables, or configured in the Cloudflare dashboard.
